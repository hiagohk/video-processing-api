name: CI - Video Processing API
on:
  pull_request:
    branches: ["main", "develop"]
  push:
    branches: ["main"]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11
          cache: "pip"
      - name: Instalar dependências de dev
        run: pip install -r requirements-dev.txt
      - name: Rodar Ruff (lint)
        run: ruff check .
      - name: Verificar formatação (Black)
        run: black --check .
  test:
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: videos
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      localstack:
        image: localstack/localstack:3.8.1
        env:
          SERVICES: sqs
          AWS_DEFAULT_REGION: us-east-1
        ports:
          - 4566:4566
        options: >-
          --health-cmd="curl -f http://localhost:4566/_localstack/health || exit 1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=15s
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11
          cache: "pip"
      - name: Instalar dependências
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Rodar migrations (Alembic)
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/videos
        run: alembic upgrade head
      - name: Rodar testes
        env:
          PYTHONPATH: .
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/videos
          AWS_ENDPOINT_URL: http://localhost:4566
        run: pytest --maxfail=1 --disable-warnings -q
      - name: Build Docker
        run: docker build -t video-processing-api .