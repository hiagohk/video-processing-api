name: CI - Video Processing API

on:
  pull_request:
    branches: ["main", "develop"]
  push:
    branches: ["main"]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11
          cache: "pip"

      - name: Instalar dependências de dev
        run: pip install -r requirements-dev.txt

      - name: Rodar Ruff (lint)
        run: ruff check .

      - name: Verificar formatação (Black)
        run: black --check .

  test:
    runs-on: ubuntu-latest
    needs: lint
    env:
      PYTHONPATH: .
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: videos
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      localstack:
        image: localstack/localstack:2.3
        env:
          SERVICES: sqs
          DEBUG: 1
          LS_LOG: trace
          AWS_DEFAULT_REGION: us-east-1
        ports:
          - 4566:4566
        options: >-
          --health-cmd="curl -f http://localhost:4566/_localstack/health || exit 1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11
          cache: "pip"

      - name: Instalar dependências
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Wait for LocalStack to be ready
        run: |
          echo "Waiting for LocalStack..."

          for i in {1..30}; do
            response=$(curl -s http://localhost:4566/_localstack/health || true)

            echo "Attempt $i: $response"

            if echo "$response" | grep '"sqs": "available"\|"sqs": "running"'; then
              echo "LocalStack is ready!"
              exit 0
            fi

            sleep 2
          done

          echo "LocalStack did not become ready in time"
          exit 1

      - name: Rodar migrations (Alembic)
        run: alembic upgrade head

      - name: Rodar testes
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/videos
          AWS_ENDPOINT_URL: http://localhost:4566
        run: pytest --maxfail=1 --disable-warnings -q

      - name: Build Docker
        run: docker build -t video-processing-api .